<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brine recovery fixture</title><style>body{font-family:system-ui,sans-serif;max-width:60rem;margin:2rem auto;padding:0 1rem}label{display:block;margin:1rem 0}input{display:block;width:100%;box-sizing:border-box;padding:.5rem}button{padding:.5rem 1rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:1rem}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #ddd;padding:.5rem}</style></head>
<body><h1>Brine recovery fixture</h1><p>Read transaction markers and write the next marker with your authorized user identity.</p>
<form id="connect"><label>Database endpoint<input id="endpoint" required type="url" placeholder="https://database.example"></label><label>Database name<input id="database" required></label><label>User token<input id="token" type="password" autocomplete="off"></label><button>Connect</button></form>
<p id="status" role="status">Disconnected</p><button id="write" disabled>Write next marker</button><h2>Confirmed recovery markers</h2><p id="summary">No confirmed subscription</p><table><thead><tr><th>Sequence</th><th>Marker</th><th>Commit time</th><th>Scheduled</th></tr></thead><tbody id="rows"></tbody></table><pre id="evidence">No evidence recorded</pre>
<script type="module" src="/browser.js"></script></body></html>
