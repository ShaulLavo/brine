[package]
name = "brine-recovery-fixture"
version = "0.1.1"
edition = "2024"
rust-version = "1.96.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = { version = "=2.11.0", default-features = false }

[features]
logic-only = []
additive = []
destructive = []
observer-hooks = []
default-column = []
access-change = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
