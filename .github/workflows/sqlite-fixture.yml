name: Publish SQLite drill fixture
on:
  push:
    branches: [main]
    paths:
      - fixtures/sqlite-app/**
      - internal/data/**
      - go.mod
      - go.sum
      - .github/workflows/sqlite-fixture.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - name: Test and cross-compile static binaries
        run: |
          go test ./fixtures/sqlite-app
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags='-s -w' -o "fixtures/sqlite-app/bin/$arch/sqlite-app" ./fixtures/sqlite-app
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: fixtures/sqlite-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/shaullavo/brine-sqlite-fixture:latest
            ghcr.io/shaullavo/brine-sqlite-fixture:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ShaulLavo/brine
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable multi-platform reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf '## SQLite fixture\n\nPinned manifest-list reference: `ghcr.io/shaullavo/brine-sqlite-fixture@%s`\n\nPlatforms: linux/amd64, linux/arm64\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
