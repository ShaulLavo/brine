name: Native passive reader
on:
  pull_request:
    paths:
      - tools/native-reader/**
      - .github/workflows/native-reader.yml
  push:
    branches: [main]
    paths:
      - tools/native-reader/**
      - .github/workflows/native-reader.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: Portable native reader (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: Advanced Micro Devices X86-64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: AArch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Prepare exact pinned source
        run: python3 tools/native-reader/prepare.py "$RUNNER_TEMP/reader-build"
      - name: Build and test native static executable
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ runner.temp }}/reader-build
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: brine-native-reader:test
          cache-from: type=gha,scope=native-reader-${{ matrix.arch }}-14b9b5f47dcc-6b6e0ab19e4f
          cache-to: type=gha,mode=max,scope=native-reader-${{ matrix.arch }}-14b9b5f47dcc-6b6e0ab19e4f
          no-cache-filters: native-tests
      - name: Extract executable and synthetic fixture
        run: |
          container=$(docker create brine-native-reader:test)
          mkdir "$RUNNER_TEMP/reader-artifact"
          docker cp "$container:/usr/share/brine-native-reader/." "$RUNNER_TEMP/reader-artifact/"
          docker rm "$container"
          cd "$RUNNER_TEMP/reader-artifact"
          sha256sum --check SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > source-head
      - name: Verify static target and contained CLI
        env:
          MACHINE: ${{ matrix.machine }}
        run: |
          readelf -h "$RUNNER_TEMP/reader-artifact/brine-native-reader" | grep -F "$MACHINE"
          if readelf -l "$RUNNER_TEMP/reader-artifact/brine-native-reader" | grep -q INTERP; then exit 1; fi
          python3 tools/native-reader/verify_cli.py brine-native-reader:test "$RUNNER_TEMP/reader-artifact/fixture" "$RUNNER_TEMP/reader-cli-evidence" "$RUNNER_TEMP/reader-artifact/discovery-negative-fixtures"
          python3 tools/native-reader/verify_cli.py brine-native-reader:test "$RUNNER_TEMP/reader-artifact/replica-zero-fixture" "$RUNNER_TEMP/reader-zero-cli-evidence"
          cp "$RUNNER_TEMP/reader-cli-evidence/receipt.json" "$RUNNER_TEMP/reader-artifact/cli-receipt.json"
          cp "$RUNNER_TEMP/reader-zero-cli-evidence/receipt.json" "$RUNNER_TEMP/reader-artifact/zero-cli-receipt.json"
          for variant in base additive rating; do
            python3 tools/native-reader/verify_cli.py brine-native-reader:test "$RUNNER_TEMP/reader-artifact/projection-fixtures/$variant" "$RUNNER_TEMP/reader-projection-$variant-cli-evidence"
            cp "$RUNNER_TEMP/reader-projection-$variant-cli-evidence/receipt.json" "$RUNNER_TEMP/reader-artifact/projection-$variant-cli-receipt.json"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-reader-${{ matrix.arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/reader-artifact
          retention-days: 30

  gate:
    name: Complete native reader gate
    if: always()
    needs: [portable]
    runs-on: ubuntu-24.04
    steps:
      - name: Require both native platforms
        env:
          RESULT: ${{ needs.portable.result }}
        run: test "$RESULT" = success

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [portable, gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-reader-amd64-${{ github.sha }}
          path: package/amd64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: native-reader-arm64-${{ github.sha }}
          path: package/arm64
      - name: Verify immutable input bundles
        run: |
          for arch in amd64 arm64; do
            test "$(cat "package/$arch/source-head")" = "$GITHUB_SHA"
            (cd "package/$arch" && sha256sum --check SHA256SUMS)
            chmod 0555 "package/$arch/brine-native-reader"
            test -x "package/$arch/brine-native-reader"
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: package
          file: tools/native-reader/Package.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/shaullavo/brine-native-reader:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ShaulLavo/brine
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record actual published digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Pinned native reader index: `ghcr.io/shaullavo/brine-native-reader@%s`\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          for arch in amd64 arm64; do cat "package/$arch/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"; done
