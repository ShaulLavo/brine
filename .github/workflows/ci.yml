name: Go CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)"
      - name: Whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Module tidiness
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Vet Mac client
        run: GOOS=darwin GOARCH=arm64 go vet ./...
      - name: Test
        run: go test ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/brine
