name: Go CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify CI inputs
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base=$(./scripts/lint-base.sh "$EVENT_NAME" "$PUSH_BASE")
          scope=$(./scripts/ci-scope.sh "$base" HEAD)
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

  cli-pair:
    name: Linux CLI binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/go-ci
        with:
          role: cli-pair
      - run: bash scripts/build-cli-pair.sh "$RUNNER_TEMP/brine-cli-pair"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brine-cli-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/brine-cli-pair/
          if-no-files-found: error
          retention-days: 3

  helpers:
    name: Publication helper tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: ./scripts/check.sh test-helpers

  test:
    name: Tests, types and Mac client
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-ci
        with:
          role: test
      - run: bash scripts/test-ci.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - run: ./scripts/check.sh test-normal
      - name: Check optional SpacetimeDB runtime probe
        run: bash scripts/check-spacetime-runtime.sh

  race:
    needs: changes
    if: always()
    name: Race tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [store, rest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-ci
        if: needs.changes.outputs.scope != 'docs'
        with:
          role: race-${{ matrix.shard }}
      - run: ./scripts/check.sh test-race-${{ matrix.shard }}
        if: needs.changes.outputs.scope != 'docs'
      - name: Documentation-only change has no race inputs
        if: needs.changes.outputs.scope == 'docs'
        run: echo 'Normal Go tests, vet, format and documentation contracts still run in full.'

  race-host-build:
    needs: changes
    if: always()
    name: Race tests (host build)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-ci
        if: needs.changes.outputs.scope != 'docs'
        with:
          role: race-host
      # Build the race test binary once and prove every test belongs to one shard.
      - run: ./scripts/check.sh test-race-host-build "$RUNNER_TEMP/host-race"
        if: needs.changes.outputs.scope != 'docs'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.changes.outputs.scope != 'docs'
        with:
          name: host-race-${{ github.sha }}
          path: ${{ runner.temp }}/host-race/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Documentation-only change has no race inputs
        if: needs.changes.outputs.scope == 'docs'
        run: echo 'Normal Go tests, vet, format and documentation contracts still run in full.'

  race-host:
    needs: [changes, race-host-build]
    if: always() && needs.race-host-build.result == 'success'
    name: Race tests (host ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The prebuilt binary needs no Go toolchain or build cache, only this checkout's testdata.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.changes.outputs.scope != 'docs'
        with:
          name: host-race-${{ github.sha }}
          path: ${{ runner.temp }}/host-race
      - run: chmod +x "$RUNNER_TEMP/host-race/host.test" && ./scripts/check.sh test-race-host-shard ${{ matrix.shard }} "$RUNNER_TEMP/host-race"
        if: needs.changes.outputs.scope != 'docs'
      - name: Documentation-only change has no race inputs
        if: needs.changes.outputs.scope == 'docs'
        run: echo 'Normal Go tests, vet, format and documentation contracts still run in full.'

  lint:
    name: New-code static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/go-ci
        with:
          role: lint
      - name: Select the checked-out lint base
        id: lint-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          sha=$(./scripts/lint-base.sh "$EVENT_NAME" "$PUSH_BASE")
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          skip-cache: true
          # PR checkout is a synthetic merge; its first parent is the actual main baseline.
          args: --new-from-merge-base= --new-from-rev=${{ steps.lint-base.outputs.sha }}
      - name: Lint isolated protocol experiment
        working-directory: tools/webtransport-experiment
        run: golangci-lint run --config ../../.golangci.yml --new-from-merge-base= --new-from-rev= ./...

  structure:
    name: Authority, dead code and clones
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-ci
        with:
          role: structure
      - run: ./scripts/check.sh structure

  vulnerability:
    name: Vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/go-ci
        with:
          role: vulnerability
      - run: ./scripts/check.sh vulnerability

  gate:
    name: Complete CI gate
    if: always()
    needs: [changes, test, race, race-host-build, race-host, lint, structure, vulnerability, cli-pair, helpers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every CI job
        env:
          CHANGES: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.scope }}
          HELPERS: ${{ needs.helpers.result }}
          TEST: ${{ needs.test.result }}
          RACE: ${{ needs.race.result }}
          RACE_HOST_BUILD: ${{ needs.race-host-build.result }}
          RACE_HOST: ${{ needs.race-host.result }}
          LINT: ${{ needs.lint.result }}
          STRUCTURE: ${{ needs.structure.result }}
          VULNERABILITY: ${{ needs.vulnerability.result }}
          CLI_PAIR: ${{ needs.cli-pair.result }}
        run: |
          [[ $CHANGES == success && ( $SCOPE == full || $SCOPE == docs ) ]]
          [[ $HELPERS == success && $TEST == success && $RACE == success && $RACE_HOST_BUILD == success && $RACE_HOST == success && $LINT == success && $STRUCTURE == success && $VULNERABILITY == success && $CLI_PAIR == success ]]
