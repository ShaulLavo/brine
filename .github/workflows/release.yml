name: Release binaries
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Candidate tag matching cli.Version, build and compare only
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: brine-release-${{ github.ref }}
  cancel-in-progress: false

env:
  BRINE_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  GOTOOLCHAIN: local

jobs:
  gate:
    if: github.repository == 'ShaulLavo/brine'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bun test tools/ci/release
      - name: Require clean source on main with successful source CI and exact tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts gate

  build:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 3

  rebuild:
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - run: bash scripts/build-release.sh "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-rebuild
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 3

  compare:
    needs: [build, rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/compare
      - name: Verify exact files, receipt and every independent artifact checksum
        run: bun scripts/release.ts compare "$RUNNER_TEMP/compare/release-build" "$RUNNER_TEMP/compare/release-rebuild"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'ShaulLavo/brine'
    needs: [gate, compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build
          path: ${{ runner.temp }}/release
      - name: Recheck main, green CI, tag, bytes and known release absence before attesting
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts preflight "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            ${{ runner.temp }}/release/brine-linux-amd64
            ${{ runner.temp }}/release/brine-linux-arm64
            ${{ runner.temp }}/release/brine-darwin-amd64
            ${{ runner.temp }}/release/brine-darwin-arm64
            ${{ runner.temp }}/release/receipt.json
            ${{ runner.temp }}/release/SHA256SUMS
      - name: Recheck absence and create once, never upload over an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release.ts publish "$RUNNER_TEMP/release"
