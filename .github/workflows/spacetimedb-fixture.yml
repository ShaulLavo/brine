name: Publish SpacetimeDB drill fixture
on:
  push:
    branches: [main]
    paths:
      - fixtures/spacetimedb-app/**
      - internal/spacetimedb/**
      - .github/workflows/spacetimedb-fixture.yml
  pull_request:
    paths:
      - fixtures/spacetimedb-app/**
      - internal/spacetimedb/**
      - .github/workflows/spacetimedb-fixture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - name: Install exact module toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build and check module/client pairs
        env:
          BRINE_FIXTURE_BUILD_ROOT: ${{ runner.temp }}/spacetimedb-fixture
        run: ./fixtures/spacetimedb-app/build.sh
      - name: Install pinned browser test dependency
        run: |
          bun install --cwd fixtures/spacetimedb-app/browser-test --frozen-lockfile
          fixtures/spacetimedb-app/browser-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise official SDK and pinned local runtime
        run: python3 fixtures/spacetimedb-app/smoke.py "$RUNNER_TEMP/spacetimedb-fixture"
      - name: Stage immutable publication bundle
        run: |
          mkdir -p "$RUNNER_TEMP/fixture-release/bin" "$RUNNER_TEMP/fixture-release/artifacts"
          cp -R fixtures/spacetimedb-app/bin/. "$RUNNER_TEMP/fixture-release/bin/"
          cp -R "$RUNNER_TEMP/spacetimedb-fixture/artifacts/." "$RUNNER_TEMP/fixture-release/artifacts/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacetimedb-fixture-${{ github.sha }}
          path: ${{ runner.temp }}/fixture-release/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: spacetimedb-fixture-${{ github.sha }}
          path: fixtures/spacetimedb-app/release/
      - name: Verify downloaded identities
        run: |
          python3 fixtures/spacetimedb-app/check-release.py fixtures/spacetimedb-app/release "$GITHUB_SHA"
          cp -R fixtures/spacetimedb-app/release/bin fixtures/spacetimedb-app/bin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: fixtures/spacetimedb-app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/shaullavo/brine-spacetimedb-fixture:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ShaulLavo/brine
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Record immutable index/platform/module pins
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Fixture index: ghcr.io/shaullavo/brine-spacetimedb-fixture@%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect --raw "ghcr.io/shaullavo/brine-spacetimedb-fixture@$DIGEST" > "$RUNNER_TEMP/image-index.json"
          python3 fixtures/spacetimedb-app/record-publication.py "$DIGEST" "$GITHUB_SHA" "$RUNNER_TEMP/image-index.json" "$RUNNER_TEMP/publication-pins.json" fixtures/spacetimedb-app/release/artifacts/manifest.json
          cat "$RUNNER_TEMP/publication-pins.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spacetimedb-publication-${{ github.sha }}
          path: ${{ runner.temp }}/publication-pins.json
          if-no-files-found: error
          retention-days: 30
